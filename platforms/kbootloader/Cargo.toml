[package]
name = "kbootloader"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["bootloader", "x-kernel", "multi-arch", "position-independent"]
description = "Position-independent bootloader for x-kernel (multi-arch)"

[dependencies]
kbuild_config = { workspace = true }
kplat = { workspace = true }
page_table = { workspace = true }

# Architecture-specific dependencies
[target.'cfg(target_arch = "aarch64")'.dependencies]
kcpu = { workspace = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.11"

[features]
default = []

# Enable FP/SIMD instructions during boot
fp-simd = ["kcpu/fp-simd"]

# Enable verbose boot logging
debug-print = []

[lib]
name = "kbootloader"

[profile.release]
opt-level = 2
lto = "thin"

